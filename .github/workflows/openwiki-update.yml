# OpenWiki scheduled updater, adapted to the Forgejo-primary layout.
#
# Source of truth is Forgejo (`Delnegend/ztna-agent`); the GitHub twin holds
# no source and exists only for free hosted runners. So this workflow fetches
# the source from Forgejo (like `ci.yaml` does), runs the OpenWiki update,
# and pushes the result branch back to Forgejo — the docs PR is opened there
# with the Forgejo CLI, not with `peter-evans/create-pull-request` (which
# would target the sourceless twin).
#
# Required GitHub secrets: FORGEJO (read-only checkout token), FJ_PUSH (push
# token for the openwiki/update branch), FJ_URL (Forgejo base, e.g.
# https://git.delnegend.com), OPENAI_API_KEY, OPENWIKI_LANGSMITH_API_KEY
# (for the LangSmith connector pull).
# Required Forgejo secret: OPENWIKI_PR_TOKEN is NOT needed — the push token
# above owns the branch and `tea` opens the PR with it.
name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

env:
  FJ_REPO: git.delnegend.com/Delnegend

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v3  # nosemgrep
        with:
          token: ${{ secrets.FORGEJO }}
          fj_repo: ${{ env.FJ_REPO }}/${{ github.event.repository.name }}
          ref: main
          # Full history so `openwiki code --update` can diff HEAD against
          # the commit it last documented; a shallow clone hides that commit
          # and the update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.7.2 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: "gpt-5.6-terra"
          # Required for the LangSmith connector's code-mode pull to authenticate.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Number wiki headings
        # Deterministic post-step: the INSTRUCTIONS.md brief asks the model for
        # numbered headings, but only this script guarantees them. Idempotent —
        # safe to re-run. Skips index.md, .claims/, front matter, fenced blocks.
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import pathlib, re
          for p in sorted(pathlib.Path("openwiki").rglob("*.md")):
              if p.name in ("index.md", "INSTRUCTIONS.md") or ".claims" in p.parts:
                  continue
              lines = p.read_text().splitlines(keepends=True)
              in_fm = lines and lines[0] == "---\n"
              in_fence = False
              counters = [0] * 7
              out = []
              for i, l in enumerate(lines):
                  if in_fm:
                      out.append(l)
                      if i > 0 and l == "---\n":
                          in_fm = False
                      continue
                  s = l.rstrip("\n")
                  if s.startswith("```"):
                      in_fence = not in_fence
                      out.append(l)
                      continue
                  m = re.match(r"^(#{1,6})\s+(.*?)\s*$", s)
                  if m and not in_fence:
                      level = len(m.group(1))
                      text = re.sub(r"^\d+(\.\d+)*\.\s+", "", m.group(2))
                      if level == 1:
                          out.append(f"# {text}\n")
                      else:
                          counters[level] += 1
                          for d in range(level + 1, 7):
                              counters[d] = 0
                          num = ".".join(str(counters[d]) for d in range(2, level + 1)) + "."
                          out.append(f"{'#' * level} {num} {text}\n")
                  else:
                      out.append(l)
              p.write_text("".join(out))
          print("headings numbered")
          EOF

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Push update branch to Forgejo and open PR
        if: ${{ !cancelled() }}
        env:
          FJ_URL: ${{ secrets.FJ_URL }}
          FJ_PUSH: ${{ secrets.FJ_PUSH }}
          OPENWIKI_OUTCOME: ${{ steps.openwiki.outcome }}
        run: |
          set -euo pipefail
          [ -n "${FJ_URL:-}" ] && [ -n "${FJ_PUSH:-}" ] || {
            echo "::error::set the FJ_URL and FJ_PUSH repository secrets"
            exit 1
          }
          git config user.name "openwiki-bot"
          git config user.email "openwiki-bot@users.noreply.github.com"
          git checkout -B openwiki/update
          paths="openwiki AGENTS.md .github/workflows/openwiki-update.yml"
          if [ -e CLAUDE.md ]; then paths="$paths CLAUDE.md"; fi
          # shellcheck disable=SC2086
          git add -- $paths
          if git diff --cached --quiet; then
            echo "No wiki changes; nothing to push."
            exit 0
          fi
          git commit -m "docs: update OpenWiki" -m "OpenWiki result: $OPENWIKI_OUTCOME"
          git push "https://openwiki-bot:${FJ_PUSH}@${FJ_URL#https://}/${{ env.FJ_REPO }}/${{ github.event.repository.name }}.git" openwiki/update --force-with-lease
          curl -fsS -X POST "${FJ_URL}/api/v1/repos/${{ env.FJ_REPO }}/${{ github.event.repository.name }}/pulls" \
            -H "Authorization: token ${FJ_PUSH}" -H 'Content-Type: application/json' \
            -d '{"head":"openwiki/update","base":"main","title":"docs: update OpenWiki","body":"Automated OpenWiki documentation update.\n\nOpenWiki result: '"$OPENWIKI_OUTCOME"'.\n\nWhen the result is failure, this PR intentionally preserves only the pages completed before the failure. Merge it to make that progress the baseline for the next scheduled run."}' \
            || echo "::notice::PR creation failed (it may already exist)"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
