# Release for the private Forgejo repo `Delnegend/ztna-agent`.
#
# Three targets, dispatched by the Forgejo `release` workflow:
#   new-tag (default) — dispatched with the new `vX.Y.Z` tag; builds the tag
#     and publishes artifacts.
#   tag    — rebuild an existing tag (repair path); builds and publishes.
#   commit — test-build a commit SHA; artifacts go to the Actions run only,
#     no GitHub Release.
# Artifacts (ztna-cli, ztna-admincheck, ztna-linux) publish to GitHub Releases.
# The Forgejo action mirrors the binary release back to Forgejo.

name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release mode / build target
        required: true
        type: choice
        default: new-tag
        options:
          - new-tag
          - tag
          - commit
      ref:
        description: Tag (new-tag/tag) or commit SHA (commit)
        required: true
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false

run-name: "release ${{ inputs.correlation_id || github.sha }}"

# Serialise releases: concurrent runs on the same tag would race on one
# GitHub Release.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  FJ_REPO: git.delnegend.com/Delnegend

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve Version and Publish Flag
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [ "$INPUT_TARGET" = "commit" ]; then
            # Test build: any commit SHA, no tag, no version, no publish.
            echo "$INPUT_REF" | grep -qE '^[0-9a-f]{4,64}$' || { echo "::error::commit target needs a commit SHA, got '${INPUT_REF}'"; exit 1; }
            echo "version=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "target_ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "test build against commit $INPUT_REF (will not publish)"
            exit 0
          fi

          # new-tag and tag both build a version tag and publish.
          if echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${INPUT_REF#v}"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "target_ref=${INPUT_REF}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "resolved version: $VER (from input ref $INPUT_REF)"
            exit 0
          fi

          echo "::error::tag target needs a version tag (e.g. v0.2.0), got '${INPUT_REF}'"
          exit 1

      - name: Fail if this version was already released
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists on ${GITHUB_REPOSITORY} — delete it first (gh release delete v${VERSION} --repo ${GITHUB_REPOSITORY} --yes), then re-run"
            exit 1
          fi
          echo "no existing release v${VERSION}; proceeding"

  build:
    name: Build Binaries (x86_64-unknown-linux-musl + GUI glibc)
    needs: prepare
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch source from Forgejo
        uses: Vessel9457/actions/checkout@v3 # tracks Delnegend/actions  # nosemgrep
        with:
          token: ${{ secrets.FORGEJO }}
          fj_repo: ${{ env.FJ_REPO }}/${{ github.event.repository.name }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      - name: Write Global CA client identity
        # Test-builds compile untrusted SHAs: keep production secrets out.
        if: needs.prepare.outputs.publish == 'true'
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - name: Update Cargo.toml workspace version
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          with open('Cargo.lock', 'r') as f:
              content = f.read()
          content = re.sub(r'(name = \"ztna-[^\"]+\"\nversion = )\"[^\"]+\"', rf'\g<1>\"{v}\"', content)
          with open('Cargo.lock', 'w') as f:
              f.write(content)
          "

      - name: Install clang + mold + musl toolchain + GTK4/Adwaita libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold musl-tools libgtk-4-dev libadwaita-1-dev
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Synchronize Cargo.lock (musl, no GUI)
        run: |
          set -euo pipefail
          # ztna-linux needs system GTK (glibc): it never links static musl.
          cargo check --workspace --exclude ztna-linux --target x86_64-unknown-linux-musl

      - name: Build (musl, no GUI)
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=--target=x86_64-unknown-linux-musl -C link-arg=-fuse-ld=mold"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build -p ztna-cli -p ztna-admincheck --release --target x86_64-unknown-linux-musl \
            --message-format=json-render-diagnostics > cargo-build-musl.json

      - name: Build GUI (glibc, system GTK)
        run: |
          set -euo pipefail
          cargo build -p ztna-linux --release \
            --message-format=json-render-diagnostics > cargo-build-gui.json

      - name: Package
        env:
          REF_SLUG: ${{ needs.prepare.outputs.target_ref }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # One tarball per binary: <name>-<version>-linux.tar.gz (test builds
          # use the short SHA instead of a version).
          if [ "$PUBLISH" = "true" ]; then
            TAG="$APP_VERSION"
          else
            TAG="$REF_SLUG"
          fi
          # Only the three shipped artifacts make it into assets: ztna-cli
          # (the `ztna` binary), ztna-admincheck, and ztna-linux (GUI).
          # Workspace siblings such as ztna-mitm or ztna-api's apigen/inspect
          # are not released.
          mapfile -t BUILT < <(jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' cargo-build-musl.json cargo-build-gui.json | sort -u)
          EXES=()
          for exe in "${BUILT[@]}"; do
            case "$(basename "$exe")" in
              ztna|ztna-admincheck|ztna-linux) EXES+=("$exe") ;;
            esac
          done
          [ "${#EXES[@]}" -eq 3 ] || {
            echo "::error::expected the 3 release binaries (ztna, ztna-admincheck, ztna-linux), got ${#EXES[@]}"
            exit 1
          }
          ASSETS=""
          for exe in "${EXES[@]}"; do
            name="$(basename "$exe")"
            # Ship the CLI under its crate name; the binary stays `ztna`.
            case "$name" in
              ztna) name="ztna-cli" ;;
            esac
            dir="${name}-${TAG}-linux"
            mkdir -p "$dir"
            cp "$exe" "$dir/" || exit 1
            tar -czf "${dir}.tar.gz" "$dir"
            rm -rf "$dir"
            ASSETS+="${dir}.tar.gz"$'\n'
          done
          ls -lh ./*.tar.gz
          echo "ASSETS<<EOF" >> "$GITHUB_ENV"
          printf '%s' "$ASSETS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Upload test-build artifacts
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts-${{ needs.prepare.outputs.target_ref }}
          path: ${{ env.ASSETS }}
          if-no-files-found: error

      - name: Create GitHub Release on Vessel9457
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.prepare.outputs.version }}
          TARGET_REF: ${{ needs.prepare.outputs.target_ref }}
          ASSETS: ${{ env.ASSETS }}
        run: |
          set -euo pipefail
          # The workspace's `origin` points at Forgejo, so `gh` cannot infer the
          # repository — pass it explicitly.
          mapfile -t ASSET_LIST <<< "${ASSETS%$'\n'}"
          [ "${#ASSET_LIST[@]}" -gt 0 ] || { echo "::error::no assets packaged"; exit 1; }
          gh release create "$VERSION" "${ASSET_LIST[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$VERSION" \
            --notes "To be disclosed"
