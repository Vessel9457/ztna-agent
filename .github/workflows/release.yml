# Release for the private Forgejo repo `Delnegend/ztna-agent`.
#
# Three targets, dispatched by the Forgejo `release` workflow:
#   new-tag (default): dispatched with the new `vX.Y.Z` tag; builds the tag
#     and publishes artifacts.
#   tag   : rebuild an existing tag (repair path); builds and publishes.
#   commit: test-build a commit SHA; artifacts go to the Actions run only,
#     no GitHub Release.
# Artifacts (ztna-cli, ztna-admincheck, ztna-app) publish to GitHub Releases.
# The Forgejo action mirrors the binary release back to Forgejo.

name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release mode / build target
        required: true
        type: choice
        default: new-tag
        options:
          - new-tag
          - tag
          - commit
      ref:
        description: Tag (new-tag/tag) or commit SHA (commit)
        required: true
      correlation_id:
        description: Caller correlation id (echoed in the run name)
        required: false

run-name: "release ${{ inputs.correlation_id || github.sha }}"

# Serialise releases: concurrent runs on the same tag would race on one
# GitHub Release.
concurrency:
  group: release-main
  cancel-in-progress: false


jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve Version and Publish Flag
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [ "$INPUT_TARGET" = "commit" ]; then
            # Test build: any commit SHA, no tag, no version, no publish.
            echo "$INPUT_REF" | grep -qE '^[0-9a-f]{4,64}$' || { echo "::error::commit target needs a commit SHA, got '${INPUT_REF}'"; exit 1; }
            {
              echo "version=$INPUT_REF"
              echo "target_ref=$INPUT_REF"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            echo "test build against commit $INPUT_REF (will not publish)"
          fi

          # new-tag and tag both build a version tag and publish.
          if echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${INPUT_REF#v}"
            {
              echo "version=$VER"
              echo "target_ref=${INPUT_REF}"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
            echo "resolved version: $VER (from input ref $INPUT_REF)"
            exit 0
          fi

          echo "::error::tag target needs a version tag (e.g. v0.2.0), got '${INPUT_REF}'"
          exit 1
      - name: Fail if this version was already released
        if: steps.resolve.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists on ${GITHUB_REPOSITORY}; delete it first (gh release delete v${VERSION} --repo ${GITHUB_REPOSITORY} --yes), then re-run"
            exit 1
          fi
          echo "no existing release v${VERSION}; proceeding"

  build-musl:
    name: Build musl binaries (cli + admincheck)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        uses: Delnegend/actions/twin-checkout@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
        with:
          token: ${{ secrets.FORGEJO }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      # Deliberately embedded for compatibility with existing servers.
      - name: Provide client identity for build
        shell: bash
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          umask 077
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Update Cargo.toml workspace version
        if: needs.prepare.outputs.publish == 'true'
        run: just version set "${{ needs.prepare.outputs.version }}"

      - name: Install clang + mold + musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold musl-tools
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Synchronize Cargo.lock (musl, no GUI)
        run: |
          set -euo pipefail
          # The graphical app is built separately for glibc.
          cargo check --workspace --exclude ztna-app --target x86_64-unknown-linux-musl

      - name: Build (musl, no GUI)
        env:
          RUSTFLAGS: "-C linker=clang -C link-arg=--target=x86_64-unknown-linux-musl -C link-arg=-fuse-ld=mold"
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build -p ztna-cli -p ztna-admincheck --release --target x86_64-unknown-linux-musl

      - name: Package ztna-cli
        uses: Delnegend/actions/package-artifact@2ca01b1399d9614cec1b87f14b75790e6011f0fa # v1
        with:
          name: ztna-cli
          version: ${{ needs.prepare.outputs.version }}
          target: x86_64-unknown-linux-musl
          source: target/x86_64-unknown-linux-musl/release/ztna

      - name: Package ztna-admincheck
        uses: Delnegend/actions/package-artifact@2ca01b1399d9614cec1b87f14b75790e6011f0fa # v1
        with:
          name: ztna-admincheck
          version: ${{ needs.prepare.outputs.version }}
          target: x86_64-unknown-linux-musl
          source: target/x86_64-unknown-linux-musl/release/ztna-admincheck

  build-gui:
    name: Build GUI (glibc)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source from Forgejo
        uses: Delnegend/actions/twin-checkout@cc01ad7470776ce23b38f14823a86d560e2d592e # v1
        with:
          token: ${{ secrets.FORGEJO }}
          ref: ${{ needs.prepare.outputs.target_ref }}

      # Deliberately embedded for compatibility with existing servers.
      - name: Provide client identity for build
        shell: bash
        env:
          GLOBAL_CLIENT_CRT: ${{ secrets.GLOBAL_CLIENT_CRT }}
          GLOBAL_CLIENT_KEY: ${{ secrets.GLOBAL_CLIENT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${GLOBAL_CLIENT_CRT:-}" ] && [ -n "${GLOBAL_CLIENT_KEY:-}" ] || {
            echo "::error::set the GLOBAL_CLIENT_CRT and GLOBAL_CLIENT_KEY repository secrets"
            exit 1
          }
          umask 077
          mkdir -p .certs
          printf '%s\n' "$GLOBAL_CLIENT_CRT" > .certs/global_client.crt
          printf '%s\n' "$GLOBAL_CLIENT_KEY" > .certs/global_client.key

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Update Cargo.toml workspace version
        if: needs.prepare.outputs.publish == 'true'
        run: just version set "${{ needs.prepare.outputs.version }}"

      - name: Install clang + mold + GTK4/Adwaita libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang mold libgtk-4-dev libadwaita-1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build GUI (glibc)
        run: |
          set -euo pipefail
          cargo build -p ztna-app --release

      - name: Package ztna-app
        uses: Delnegend/actions/package-artifact@2ca01b1399d9614cec1b87f14b75790e6011f0fa # v1
        with:
          name: ztna-app
          version: ${{ needs.prepare.outputs.version }}
          target: x86_64-unknown-linux-gnu
          source: target/release/ztna-app

  publish:
    name: Publish Consolidated Release
    needs: [prepare, build-musl, build-gui]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: Delnegend/actions/publish-release@2ca01b1399d9614cec1b87f14b75790e6011f0fa # v1
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
          publish: ${{ needs.prepare.outputs.publish }}
